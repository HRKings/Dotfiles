[build]
rustc-wrapper = "/usr/bin/sccache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--ld-path=/usr/bin/wild"]

[alias]
t="nextest run"

[unstable]
codegen-backend = true

[profile.dev-cranelift]
inherits = "dev"
codegen-backend = "cranelift"


[profile.release]
strip = "symbols"
