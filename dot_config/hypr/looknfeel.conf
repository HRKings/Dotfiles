# Float calculators
windowrule {
  name = Qalculate float
  float = on
  pin = on
  match:class = (io.github.Qalculate.qalculate-qt|qalculate-gtk)
}


# Rule for floating windows
windowrule {
  name = Junction float
  float = on
  match:class = re.sonny.Junction
}

windowrule {
  name = File picker float
  float = on
  match:initial_title = (Open File)
}

windowrule {
  name = Calendar float
  float = on
  match:class = (org.gnome.Calendar)
}


windowrule {
  name = KDE portal float
  float = on
  size = (monitor_w*0.5) 720
  match:initial_class = org.freedesktop.impl.portal.desktop.kde
}


windowrule {
  name = KDE Connect float
  float = on
  size = 950 670
  match:class = org.kde.kdeconnect.app
}


windowrule {
  name = Thunderbird reminders float
  float = on
  size = 780 320
  pin = on
  match:class = org.mozilla.Thunderbird
  match:initial_title = (Calendar Reminders)
}

windowrule {
  name = KoboldCpp Floating
  float = on
  center = on
  match:title = KoboldCpp.*
}

windowrule {
  name = KoboldCpp Tooltips
  float = on
  no_initial_focus = on
  match:title = CTkToplevel
}

# Floating audio mixer
windowrule {
  name = Wiremix float
  float = on
  pin = on
  size = (monitor_w*0.5) (monitor_h*0.5)
  move = ((monitor_w*1)-window_w-8) (32)
  match:class = wiremix.tui
}

windowrule {
  name = Copyq Float
  float = on
  pin = on
  center = on
  size = (monitor_w*0.3) (monitor_h*0.5)
  match:initial_class = com.github.hluk.copyq
}

# Try to correct the floating 1Password Quick Access
windowrule {
  name = 1Password float
  float = on
  pin = on
  match:initial_title = (.*1Password.*)
}

windowrule {
  name = Float OnlyOffice dialog
  float = on
  center = on
  match:initial_class = DesktopEditors
}

