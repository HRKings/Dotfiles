# windowrule = move 50%-w-8 32, class:(org.gnome.Calendar)

# Float additional windows (dialogs) created by scanning software
windowrule {
  name = NAPS2 float
  float = on
  match:class = naps2
  match:initial_title = negative:(^NAPS2.*)
}


# Vicinae rules
layerrule {
  name = Vicinae layer rule
  blur = on
  ignore_alpha = 0
  no_anim = on
  match:namespace = vicinae
}


# Pomodoro
windowrule {
  name = Pomodoro styling
  float = on
  pin = on
  size = 400 532
  match:class = pomodorolm
}


# No window dimming
windowrule {
  name = Discord popout no dimming
  no_dim = on
  match:initial_title = (Discord Popout)
}


# No transparency on media windows
windowrule {
  name = No transparency
  opacity = 1 1
  no_dim = on
  match:class = ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer|vesktop)$
}


bezier = overshoot, 0.05, 0.9, 0.1, 1.1
animation = specialWorkspace, 1, 5, overshoot, slidefadevert -100%

