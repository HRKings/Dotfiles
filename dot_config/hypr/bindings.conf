# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

# Terminal
bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Quake Terminal, togglespecialworkspace, quake

unbind = SUPER, SPACE
bindd = SUPER, SPACE, Laucher, exec, vicinae toggle

# Browser and file manager
bindd = SUPER SHIFT, F, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT CTRL, B, Browser, exec, zen-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT ALT CTRL, B, Browser (private), exec, zen-browser --private-window

# Music and editor
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify-launcher
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor

# TUIs
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker

# Communication
bindd = SUPER SHIFT, G, Telegram, exec, omarchy-launch-or-focus telegram "uwsm app -- Telegram"
bindd = SUPER SHIFT CTRL, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"

# Second brain
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"

# Password manager
bindd = SUPER SHIFT, slash, Passwords, exec, uwsm app -- 1password
bindd = SUPER SHIFT ALT, slash, Quick Passwords, exec, uwsm app -- 1password --quick-access

# AI
bindd = SUPER SHIFT ALT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-or-focus claude-desktop-native

# Calendar
bindd = SUPER SHIFT, C, Calendar, exec, gnome-calendar

# Web Apps
# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Manage floating windows
bindd = SUPER SHIFT, C, Center floating window, centerwindow
bindd = SUPER SHIFT, P, Pin floating window, pin
bindd = SUPER CTRL, C, Fit window center, resizeactive, exact 1920 960
bindd = SUPER CTRL, C, Fit window center, centerwindow

# Application launcher
unbind = SUPER CTRL, V
unbind = SUPER, V
unbind = SUPER, C


bindd = SUPER SHIFT, V, Advanced clipboard manager, exec, copyq toggle
bindd = SUPER, V, Clipboard manager, exec, vicinae vicinae://extensions/vicinae/clipboard/history
bindd = SUPER, PERIOD, Emoji selector, exec, vicinae vicinae://extensions/vicinae/core/search-emojis
bindd = SUPER CTRL, PERIOD, GIF selector, exec, vicinae vicinae://extensions/josephschmitt/gif-search/search
bindd = SUPER CTRL, M, Spotify Player, exec, vicinae 'vicinae://toggle?fallbackText=SpotifyPlayer'

# My preferred file manager
unbind = SUPER SHIFT, F
bindd = SUPER SHIFT, F, File manager, exec, dolphin

