# Override opacity and dimming
# bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" opaque toggle
bindd = SUPER, D, Toggle window dimming, exec, hyprctl dispatch setprop "address:$(hyprctl activewindow -j | jq -r '.address')" nodim toggle

