# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse          = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 25
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
berzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
        { run = '${EDITOR:-vi} "$@"', desc = "$EDITOR", block = true, for = "unix" },
        { run = 'code %*',    orphan = true, desc = "code",           for = "windows" },
        { run = 'code -w %*', block = true,  desc = "code (block)",   for = "windows" },
]
open = [
        { run = 'xdg-open "$1"',                desc = "Open", for = "linux" },
        { run = 'open "$@"',                    desc = "Open", for = "macos" },
        { run = 'start "" "%1"', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
        { run = 'xdg-open "$(dirname "$1")"',           desc = "Reveal", for = "linux" },
        { run = 'open -R "$1"',                         desc = "Reveal", for = "macos" },
        { run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
        { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
        { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
        { run = 'ya pub extract --list %*',   desc = "Extract here", for = "windows" },
]
play = [
        { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
        { run = 'mpv --force-window %*', orphan = true, for = "windows" },
        { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]

[plugin]
prepend_previewers = [
  { url = "*/", run = 'piper -- eza -aTL=2 --color=always --icons=always --group-directories-first --no-quotes "$1"' },
  { url = "*.md",     run = 'faster-piper --rely-on-preloader' },
  { url = "*.tar*",   run = 'faster-piper --rely-on-preloader --format=url' },
  { url = "*.txt.gz", run = 'faster-piper --rely-on-preloader' },
]

prepend_keymap = [
  { on = "<A-Up>",       run = "seek -1",      desc = "Scroll up" },
  { on = "<A-Down>",     run = "seek +1",      desc = "Scroll down" },
  { on = "<A-PageUp>",   run = "seek -15",     desc = "Scroll page up" },
  { on = "<A-PageDown>", run = "seek +15",     desc = "Scroll page down" },
  { on = "<A-Home>",     run = "seek -10000",  desc = "Scroll to the top" },
  { on = "<A-End>",      run = "seek +10000",  desc = "Scroll to the bottom" },
]

prepend_preloaders = [
  { url = "*.md",     run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w -- "$1"' },
  { url = "*.tar*",   run = 'faster-piper -- tar tf "$1"' },
  { url = "*.txt.gz", run = 'faster-piper -- gzip -dc "$1"' },
]

[[plugin.append_previewers]]
url = "*"
run = 'faster-piper -- hexyl --border=none --terminal-width=$w "$1"'


